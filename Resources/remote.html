<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e4e4e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Afstandsbediening">
<link rel="manifest" href="remote.webmanifest">
<link rel="apple-touch-icon" href="remote-icon.png">
<title>Afstandsbediening</title>
<style>
  :root {
    --ink: #1c1c1e; --dim: #6e6e73; --surface-2: #e3e3e8; --green: #30d158; --red: #ff3b30;
    --b: clamp(46px, min(15.5vw, 7.4vh), 64px);   /* a round key on the remote */
    --key: radial-gradient(circle at 50% 28%, #2e2e31, #121214 72%);
    --key-edge: inset 0 1px 0 rgba(255, 255, 255, .16), 0 0 0 3px rgba(0, 0, 0, .05), 0 3px 6px rgba(0, 0, 0, .28);
    --key-down: inset 0 2px 6px rgba(0, 0, 0, .8), 0 0 0 3px rgba(0, 0, 0, .05);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; color: var(--ink);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  /* The whole screen is the remote: brushed aluminium edge to edge. */
  body {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 1px, rgba(0, 0, 0, .012) 1px 3px),
      linear-gradient(180deg, #ececef 0%, #dcdce0 55%, #cfcfd4 100%) #dcdce0;
  }
  button { all: unset; cursor: pointer; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .err { box-shadow: 0 0 0 2px var(--red) !important; }

  main {
    height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 10px) 22px calc(env(safe-area-inset-bottom) + 14px); touch-action: none;
  }
  .k { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lbl { font-size: 10px; line-height: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: #7c7c82; }

  /* top: status light and power */
  .top { display: flex; align-items: center; justify-content: space-between; padding-left: 4px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #5a5a5f; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #a1a1a6; }
  #dot.on { background: var(--green); box-shadow: 0 0 6px rgba(48, 209, 88, .8); }
  #power { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #ff453a; background: var(--key); box-shadow: var(--key-edge); transition: transform .08s, box-shadow .08s; }
  #power svg { width: 20px; height: 20px; }
  #power.off { color: var(--green); }

  /* touch surface (black glass): swipe = arrows, tap = OK, tap near an edge = that direction */
  #pad {
    position: relative; flex: none; height: clamp(190px, 33vh, 320px); border-radius: 30px; overflow: hidden; touch-action: none;
    background: linear-gradient(160deg, #2a2a2d 0%, #111113 45%, #0b0b0c 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 0 0 1px rgba(0, 0, 0, .25), 0 6px 14px rgba(0, 0, 0, .22);
  }
  #pad .edge { position: absolute; color: rgba(255, 255, 255, .28); transition: color .15s; }
  #pad .edge.lit { color: #fff; }
  #pad [data-dir=up] { top: 12px; left: 50%; translate: -50% 0; } #pad [data-dir=down] { bottom: 12px; left: 50%; translate: -50% 0; }
  #pad [data-dir=left] { left: 12px; top: 50%; translate: 0 -50%; } #pad [data-dir=right] { right: 12px; top: 50%; translate: 0 -50%; }
  #glow {
    position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0)); transition: opacity .25s;
  }
  #glow.on { opacity: 1; transition: opacity .05s; }
  #ok-ring { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); opacity: 0; pointer-events: none; }
  #ok-ring.go { animation: ring .35s ease-out; }
  @keyframes ring { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.3); } }
  #hint { position: absolute; left: 0; right: 0; bottom: 42px; text-align: center; font-size: 13px; color: rgba(255, 255, 255, .45); transition: opacity .4s; pointer-events: none; }

  /* round keys, with the volume and channel rockers on either side */
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 12px; justify-items: center; }
  .btn { width: var(--b); height: var(--b); border-radius: 50%; display: grid; place-items: center; color: #f2f2f4; background: var(--key); box-shadow: var(--key-edge); transition: transform .08s, box-shadow .08s; }
  .btn svg { width: calc(var(--b) * .4); height: calc(var(--b) * .4); }
  .tall { grid-row: span 2; }
  .rocker {
    width: var(--b); height: calc(var(--b) * 2 + 30px); border-radius: calc(var(--b) / 2); display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, #2a2a2d, #121214); box-shadow: var(--key-edge); overflow: hidden;
  }
  .rocker button { flex: 1; width: 100%; display: grid; place-items: center; color: #f2f2f4; transition: background .08s; }
  .rocker button svg { width: calc(var(--b) * .38); height: calc(var(--b) * .38); }
  .rocker span { font-size: 12px; font-weight: 600; color: rgba(235, 235, 245, .55); font-variant-numeric: tabular-nums; min-height: 14px; }
  .btn.hit, #power.hit { transform: translateY(1px) scale(.96); box-shadow: var(--key-down); }
  .rocker button.hit { background: rgba(255, 255, 255, .1); }

  /* shortcuts along the bottom edge */
  .shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .shortcuts button {
    height: 58px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(180deg, #f7f7f9, #e6e6ea); box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 0 0 1px rgba(0, 0, 0, .07), 0 2px 4px rgba(0, 0, 0, .1);
    font-size: 12px; font-weight: 600; color: #3a3a3c; transition: transform .08s, background .08s;
  }
  .shortcuts button.hit { transform: scale(.96); background: #dcdce0; }
  .shortcuts svg { width: 21px; height: 21px; color: #1c1c1e; }

  /* ---------- sheets ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 440px; margin: 0 auto; max-height: 80%;
    background: rgba(246, 246, 248, .96); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
    border-radius: 24px 24px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px); box-shadow: 0 -10px 30px rgba(0, 0, 0, .15);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column;
  }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .18); margin: 0 auto 14px; flex: none; }
  .sheet h2 { font-size: 20px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .close { font-size: 16px; font-weight: 600; color: #007aff; padding: 4px 2px; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; min-height: 0; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; padding-bottom: 6px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); text-align: center; min-width: 0; transition: transform .1s; }
  .app.hit { transform: scale(.92); }
  .app .ic { width: 62px; height: 62px; border-radius: 15px; background: #1c1c1e; display: grid; place-items: center; overflow: hidden; font-size: 24px; font-weight: 600; color: #f2f2f4; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
  .app .ic img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .app span { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; height: 56px; padding: 0 14px; border-radius: 14px; font-size: 17px; transition: background .1s; }
  .list button.hit { background: var(--surface-2); }
  .list .live { margin-left: auto; font-size: 13px; color: #248a3d; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { height: 78px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; transition: transform .1s; }
  .tile.hit { transform: scale(.94); }
  .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .colors button { height: 38px; border-radius: 12px; transition: transform .1s; }
  .colors button.hit { transform: scale(.94); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); font-size: 15px; }
  .row small { display: block; font-size: 12px; color: var(--dim); }
  .switch { flex: none; width: 50px; height: 30px; border-radius: 15px; background: #e3e3e8; position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: translate .2s; }
  .switch.on { background: var(--green); } .switch.on::after { translate: 20px 0; }
  .note { font-size: 13px; color: var(--dim); margin-top: 10px; }

  /* typing: a panel from the top, so the phone keyboard never covers it */
  #typing {
    top: 0; bottom: auto; max-height: none; border-radius: 0 0 24px 24px; transform: translateY(-105%);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }
  #typing.on { transform: none; }
  .field { display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 8px 0 16px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--ink); font-family: inherit; font-size: 19px; outline: none; user-select: text; -webkit-user-select: text; }
  .field .clear { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #8e8e93; }
  .field .clear svg { width: 20px; height: 20px; }
  .typer-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .typer-keys button { height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); transition: transform .08s; }
  .typer-keys button.primary { background: #1c1c1e; color: #fff; box-shadow: none; }
  .typer-keys button.hit { transform: scale(.97); }
  .typer-keys svg { width: 20px; height: 20px; }
  #live { display: flex; align-items: center; gap: 8px; }
  #live::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  #live.off::before { background: #a1a1a6; }

  /* ---------- offline ---------- */
  #offline { position: fixed; inset: 0; background: rgba(236, 236, 240, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 30px; }
  #offline > div { max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  #offline h2 { font-size: 22px; } #offline p { color: var(--dim); font-size: 15px; }
  #offline .cta { height: 50px; padding: 0 22px; border-radius: 25px; background: #1c1c1e; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #offline .ghost { color: #007aff; font-size: 15px; padding: 8px; }
  #toast { position: fixed; z-index: 5; left: 50%; top: calc(env(safe-area-inset-top) + 12px); translate: -50% -20px; padding: 10px 16px; border-radius: 20px; background: rgba(28, 28, 30, .92); color: #fff; font-size: 14px; opacity: 0; transition: opacity .2s, translate .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; translate: -50% 0; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="status"><span id="dot"></span><span id="state">Verbinden…</span></div>
    <button id="power" aria-label="Aan/uit"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M17.7 6.8a8 8 0 1 1-11.4 0"/></svg></button>
  </div>

  <div id="pad" aria-label="Veeg om te bewegen, tik voor OK">
    <svg class="edge" data-dir="up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></svg>
    <svg class="edge" data-dir="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
    <svg class="edge" data-dir="left" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg>
    <svg class="edge" data-dir="right" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></svg>
    <div id="glow"></div><div id="ok-ring"></div>
    <div id="hint">Veeg om te bewegen · tik voor OK</div>
  </div>

  <div class="keys">
    <div class="k"><button class="btn" data-key="back" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><span class="lbl">Terug</span></div>
    <div class="k"><button class="btn" data-key="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/></svg></button><span class="lbl">Home</span></div>
    <div class="k"><button class="btn" data-key="settings" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button><span class="lbl">Menu</span></div>

    <div class="k tall"><div class="rocker">
      <button data-key="volup" data-repeat aria-label="Harder"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      <span id="vol">–</span>
      <button data-key="voldown" data-repeat aria-label="Zachter"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    </div><span class="lbl">Volume</span></div>
    <div class="k"><button class="btn" id="playpause" aria-label="Afspelen/pauze"><svg viewBox="0 0 24 24"><path d="m3 5 8 7-8 7z" fill="currentColor" stroke="none"/><path d="M15.5 5v14M20.5 5v14"/></svg></button><span class="lbl">Play/pauze</span></div>
    <div class="k tall"><div class="rocker">
      <button data-key="chup" aria-label="Kanaal omhoog"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <span></span>
      <button data-key="chdown" aria-label="Kanaal omlaag"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div><span class="lbl">Kanaal</span></div>
    <div class="k"><button class="btn" data-key="mute" aria-label="Geluid uit"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg></button><span class="lbl">Stil</span></div>
  </div>

  <nav class="shortcuts">
    <button data-open="apps"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</button>
    <button data-open="inputs"><svg viewBox="0 0 24 24"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>Bronnen</button>
    <button id="kbd"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Typen</button>
    <button data-open="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>Meer</button>
  </nav>
</main>

<div id="scrim"></div>
<section class="sheet" id="apps"><div class="grab"></div><h2>Apps</h2><div class="scroll"><div class="apps" id="app-grid"></div></div></section>
<section class="sheet" id="inputs"><div class="grab"></div><h2>Bronnen</h2><div class="scroll list" id="input-list"></div></section>
<section class="sheet" id="more"><div class="grab"></div><h2>Meer</h2>
  <div class="scroll">
    <div class="tiles">
      <button class="tile" data-key="rewind" aria-label="Terugspoelen"><svg viewBox="0 0 24 24"><path d="M11 18 3 12l8-6zM21 18l-8-6 8-6z"/></svg>Terugspoelen</button>
      <button class="tile" data-key="forward" aria-label="Vooruitspoelen"><svg viewBox="0 0 24 24"><path d="m13 18 8-6-8-6zM3 18l8-6-8-6z"/></svg>Vooruitspoelen</button>
      <button class="tile" data-key="info" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>Info</button>
      <button class="tile" data-key="guide" aria-label="Tv-gids"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>Tv-gids</button>
      <button class="tile" data-key="screenoff" aria-label="Scherm uit"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M4 4l16 16"/></svg>Scherm uit</button>
      <button class="tile" data-key="tvsettings" aria-label="Tv-instellingen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Instellingen</button>
    </div>
    <div class="colors">
      <button data-key="red" aria-label="Rood" style="background:#ff453a"></button><button data-key="green" aria-label="Groen" style="background:#30d158"></button>
      <button data-key="yellow" aria-label="Geel" style="background:#ffd60a"></button><button data-key="blue" aria-label="Blauw" style="background:#0a84ff"></button>
    </div>
    <button class="row" id="dpad-mode"><span>Pijltjes aan de rand<small>Tik bij een rand van het vlak om die kant op te gaan</small></span><span class="switch"></span></button>
    <p class="note">"Scherm uit" laat alleen het geluid aan; elke knop zet het beeld weer aan.</p>
  </div>
</section>
<section class="sheet" id="typing">
  <h2>Typen op de tv <button class="close" id="typing-done">Klaar</button></h2>
  <form id="typer" autocomplete="off">
    <div class="field">
      <input id="text" placeholder="Zoek of typ…" enterkeyhint="search" maxlength="200" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="clear" id="clear" aria-label="Alles wissen" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="m15 9-6 6M9 9l6 6" stroke="#fff"/></svg></button>
    </div>
  </form>
  <div class="typer-keys">
    <button id="backspace"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m17 9-6 6M11 9l6 6"/></svg>Wis letter</button>
    <button class="primary" id="enter"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Zoeken</button>
  </div>
  <p class="note" id="live"></p>
</section>

<div id="offline" hidden><div>
  <svg viewBox="0 0 24 24" style="width:44px;height:44px;color:var(--dim)"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>
  <h2>Tv niet bereikbaar</h2>
  <p id="offline-text">Staat de tv uit, of zit je telefoon op een ander wifi-netwerk?</p>
  <button class="cta" id="wake" hidden><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M17.7 6.8a8 8 0 1 1-11.4 0"/></svg>Tv aanzetten</button>
  <button class="ghost" id="retry">Opnieuw proberen</button>
</div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const APP = window.ShelfApp || null; // the phone app: Wake-on-LAN (Android) and searching the network
const NAMES = { 'Active': 'Aan', 'Active Standby': 'Stand-by', 'Screen Off': 'Scherm uit' };
let power = '', fails = 0, toastTimer = 0;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
const buzz = (ms) => { if (APP && APP.buzz) APP.buzz(ms || 10); else if (navigator.vibrate) navigator.vibrate(ms || 10); };
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'X-Shelf-Remote': '1' }, body }).then((r) => r.json());
function hit(el) { if (!el) return; el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 120); }

// A tap activates on lift, like a native button. It doesn't count when the finger moved (scrolling a list) or
// when it began while a sheet was still sliding in (a quick double tap).
let opened = 0; // when the last sheet started opening
function tap(el, fn) {
  let down = null;
  el.addEventListener('pointerdown', (e) => {
    const box = el.closest('.scroll');
    down = Date.now() - opened > 350 ? { x: e.clientX, y: e.clientY, top: box ? box.scrollTop : 0, box } : null;
  });
  el.addEventListener('pointermove', (e) => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down = null; });
  el.addEventListener('pointercancel', () => { down = null; });
  el.addEventListener('pointerup', (e) => {
    const d = down; down = null;
    if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 10 || (d.box && Math.abs(d.box.scrollTop - d.top) > 4)) return;
    hit(el); fn(e);
  });
}

// ---------- status ----------
async function status() {
  try {
    const s = await (await fetch('/status', { cache: 'no-store' })).json();
    fails = 0; power = s.power;
    $('#offline').hidden = true;
    $('#state').textContent = NAMES[s.power] || s.power || 'Verbonden';
    $('#dot').className = s.power === 'Active' || s.power === 'Screen Off' ? 'on' : '';
    $('#power').classList.toggle('off', s.power !== 'Active' && s.power !== 'Screen Off');
    $('#vol').textContent = s.muted ? 'Stil' : (s.volume == null ? '–' : s.volume);
    if (APP && s.mac) APP.remember(s.mac);
    if (!liveKnown) checkLive();
  } catch (e) {
    if (++fails >= 2) showOffline();
  }
}
let searched = false;
function showOffline() {
  // In the app: look for the TV elsewhere on the network once by itself (new address after a router restart).
  if (APP && !searched) { searched = true; APP.rescan(); }
  $('#offline').hidden = false;
  $('#wake').hidden = !(APP && APP.canWake());
  $('#offline-text').textContent = APP && APP.canWake()
    ? 'De tv slaapt diep of zit op een ander netwerk. Probeer hem aan te zetten.'
    : 'Staat de tv uit, of zit je telefoon op een ander wifi-netwerk?';
}
let statusTimer = 0;
const soon = (ms) => { clearTimeout(statusTimer); statusTimer = setTimeout(status, ms); };
setInterval(() => { if (!document.hidden) status(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) status(); });
status();
// Version 3 of the TV service mirrors typing live; older ones only take the whole text at once.
let live = false, liveKnown = false;
function checkLive() {
  fetch('/ping', { cache: 'no-store' }).then((r) => r.json()).then((p) => { live = p.version >= 3; liveKnown = true; }).catch(() => {});
}

// ---------- buttons ----------
let offHint = 0;
async function press(key, el) {
  hit(el); buzz();
  if (power === 'Active Standby' && Date.now() - offHint > 4000) { offHint = Date.now(); toast('De tv staat uit: zet hem eerst aan met de aan/uit-knop'); }
  try {
    const r = await post('/press?key=' + key);
    if (el) el.classList.toggle('err', !r.ok);
    if (!r.ok) toast(`${el ? el.getAttribute('aria-label') : key}: ${r.error}`);
    if (/vol|mute/.test(key)) soon(250);
    return r.ok;
  } catch (e) { toast('Geen verbinding met de tv'); status(); return false; }
}
document.querySelectorAll('[data-key]').forEach((el) => {
  if (el.closest('.sheet')) { tap(el, () => press(el.dataset.key, el)); return; } // in a sheet a scroll isn't a press
  let hold = 0, rep = 0;
  const stop = () => { clearTimeout(hold); clearInterval(rep); };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    press(el.dataset.key, el);
    if (el.hasAttribute('data-repeat')) hold = setTimeout(() => { rep = setInterval(() => press(el.dataset.key, el), 150); }, 420);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => el.addEventListener(t, stop));
});
// Play and pause are separate keys on the TV; one button alternates between them.
let playing = true;
$('#playpause').addEventListener('pointerdown', () => { playing = !playing; press(playing ? 'play' : 'pause', $('#playpause')); });

$('#power').addEventListener('pointerdown', () => {
  hit($('#power')); buzz(20);
  post('/press?key=power').then((r) => { if (!r.ok) toast('Aan/uit: ' + r.error); soon(1800); }).catch(() => wake());
});
function wake() {
  if (!APP || !APP.canWake()) { toast('Tv niet bereikbaar'); return; }
  APP.wake(); toast('Tv wordt aangezet…');
  let n = 0; const t = setInterval(() => { status(); if (++n > 15 || $('#offline').hidden) clearInterval(t); }, 2000);
}
tap($('#wake'), wake);
tap($('#retry'), () => { if (APP) APP.rescan(); else location.reload(); });

// ---------- touch surface ----------
const pad = $('#pad'), glow = $('#glow');
let arrows = localStorage.getItem('shelf.dpad') === '1'; // tapping near an edge of the whole surface = that direction
const STEP = 42;  // px of swipe per arrow press
let start = null;
function flash(dir) { const e = pad.querySelector(`[data-dir="${dir}"]`); e.classList.add('lit'); setTimeout(() => e.classList.remove('lit'), 160); }
function arrow(dir) { flash(dir); press(dir); }
function zone(x, y) {
  const r = pad.getBoundingClientRect(), dx = (x - r.left) / r.width - .5, dy = (y - r.top) / r.height - .5;
  const edge = arrows ? 0.12 : 0.32; // outside this, a tap is a direction
  if (Math.abs(dx) < edge && Math.abs(dy) < edge) return 'ok';
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
}
pad.addEventListener('pointerdown', (e) => {
  pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect();
  start = { x: e.clientX, y: e.clientY, ax: e.clientX, ay: e.clientY, moved: false };
  glow.style.left = e.clientX - r.left + 'px'; glow.style.top = e.clientY - r.top + 'px'; glow.classList.add('on');
  hideHint();
});
pad.addEventListener('pointermove', (e) => {
  if (!start) return;
  const r = pad.getBoundingClientRect();
  glow.style.left = e.clientX - r.left + 'px'; glow.style.top = e.clientY - r.top + 'px';
  const dx = e.clientX - start.ax, dy = e.clientY - start.ay;
  if (Math.abs(dx) >= STEP || Math.abs(dy) >= STEP) {
    start.moved = true;
    if (Math.abs(dx) > Math.abs(dy)) { arrow(dx > 0 ? 'right' : 'left'); start.ax += Math.sign(dx) * STEP; start.ay = e.clientY; }
    else { arrow(dy > 0 ? 'down' : 'up'); start.ay += Math.sign(dy) * STEP; start.ax = e.clientX; }
  }
});
pad.addEventListener('pointerup', (e) => {
  glow.classList.remove('on');
  if (!start) return;
  const still = !start.moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 14;
  if (still) {
    const z = zone(e.clientX, e.clientY);
    if (z === 'ok') { const ring = $('#ok-ring'); ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go'); press('ok'); }
    else arrow(z);
  }
  start = null;
});
pad.addEventListener('pointercancel', () => { glow.classList.remove('on'); start = null; });
function hideHint() { $('#hint').style.opacity = 0; localStorage.setItem('shelf.hint', '1'); }
if (localStorage.getItem('shelf.hint')) $('#hint').hidden = true;
function setArrows(on) { arrows = on; localStorage.setItem('shelf.dpad', on ? '1' : '0'); $('#dpad-mode .switch').classList.toggle('on', on); }
tap($('#dpad-mode'), () => setArrows(!arrows));
setArrows(arrows);

// ---------- sheets ----------
let open = null;
function sheet(id) {
  if (open) open.classList.remove('on');
  open = id ? $('#' + id) : null;
  $('#scrim').classList.toggle('on', !!open);
  if (open) { open.classList.add('on'); opened = Date.now(); }
  if (id !== 'typing') $('#text').blur();
}
tap($('#scrim'), () => sheet(null));
window.remoteBack = () => { if (!open) return false; sheet(null); return true; }; // Android's back gesture
document.querySelectorAll('[data-open]').forEach((b) => tap(b, () => { sheet(b.dataset.open); load(b.dataset.open); }));
// Swipe a bottom sheet down by its handle or title to close it (the list inside scrolls normally).
document.querySelectorAll('.sheet:not(#typing)').forEach((s) => {
  let y0 = null;
  s.addEventListener('touchstart', (e) => { y0 = e.target.closest('.scroll') ? null : e.touches[0].clientY; }, { passive: true });
  s.addEventListener('touchmove', (e) => { if (y0 != null && e.touches[0].clientY - y0 > 60) { sheet(null); y0 = null; } }, { passive: true });
});

async function load(which) {
  if (which === 'apps') {
    const grid = $('#app-grid');
    if (!grid.children.length) grid.innerHTML = '<p class="note">Laden…</p>';
    try {
      const list = await (await fetch('/apps', { cache: 'no-store' })).json();
      if (!Array.isArray(list)) throw new Error(list.error || 'geen lijst');
      grid.replaceChildren(...list.map((a) => {
        const b = document.createElement('button'); b.className = 'app';
        const ic = document.createElement('div'); ic.className = 'ic';
        const letter = () => { ic.replaceChildren(); ic.textContent = (a.title || '?')[0]; };
        if (a.icon) { const img = new Image(); img.alt = ''; img.draggable = false; img.onerror = letter; img.src = a.icon; ic.append(img); } else letter();
        const name = document.createElement('span'); name.textContent = (a.title || '').split(/: | - | – /)[0];
        b.append(ic, name);
        tap(b, () => launch(a.id));
        return b;
      }));
    } catch (e) { grid.innerHTML = '<p class="note">Apps laden lukt niet.</p>'; }
  }
  if (which === 'inputs') {
    const box = $('#input-list');
    try {
      const list = await (await fetch('/inputs', { cache: 'no-store' })).json();
      box.replaceChildren(...list.map((i) => {
        const b = document.createElement('button');
        b.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>';
        b.append(i.title);
        if (i.live) { const l = document.createElement('span'); l.className = 'live'; l.textContent = '● signaal'; b.append(l); }
        tap(b, () => launch(i.id));
        return b;
      }));
    } catch (e) { box.innerHTML = '<p class="note">Bronnen laden lukt niet.</p>'; }
  }
}
async function launch(id) {
  buzz();
  try {
    const r = await post('/launch?id=' + encodeURIComponent(id));
    if (r.ok) setTimeout(() => sheet(null), 150); else toast('Openen lukt niet: ' + r.error);
  } catch (e) { toast('Geen verbinding met de tv'); }
}

// ---------- typing ----------
// The field on the phone mirrors the TV's search box: every change goes over at once (new letters, removed
// letters), so what you see here is what is on the TV. Older TV services take the whole text on Zoeken instead.
const text = $('#text');
let sent = '', queue = Promise.resolve();
function sync() {
  $('#clear').hidden = !text.value;
  queue = queue.then(async () => {
    const now = text.value;
    if (!live || now === sent) return;
    let p = 0;
    while (p < now.length && p < sent.length && now[p] === sent[p]) p++;
    const gone = sent.length - p, added = now.slice(p);
    if (gone) { const r = await post('/erase?n=' + gone); if (!r.ok) throw new Error(r.error); }
    if (added) { const r = await post('/type', added); if (!r.ok) throw new Error(r.error); }
    sent = now;
  }).catch((e) => { sent = text.value; toast('Typen lukt niet: ' + (e.message || 'geen verbinding')); });
}
text.addEventListener('input', sync);
function openTyping() {
  text.value = ''; sent = ''; $('#clear').hidden = true;
  sheet('typing');
  text.focus(); // inside the tap itself, or iOS won't show the keyboard
  $('#live').classList.toggle('off', !live);
  $('#live').textContent = live ? 'Wat je typt staat meteen op de tv. Kies eerst een zoekvak op de tv.'
    : 'Kies eerst een zoekvak op de tv; de tekst gaat erheen als je op Zoeken tikt.';
}
tap($('#kbd'), openTyping);
$('#kbd').addEventListener('click', () => { if (open && open.id === 'typing') text.focus(); });
text.addEventListener('blur', () => setTimeout(() => window.scrollTo(0, 0), 50));
tap($('#typing-done'), () => sheet(null));
tap($('#clear'), () => { text.value = ''; sync(); text.focus(); });
tap($('#backspace'), () => {
  if (live && !text.value) { post('/erase?n=1').catch(() => {}); buzz(); return; } // also letters that were on the TV already
  text.value = text.value.slice(0, -1); sync();
});
async function search() {
  await queue;
  if (!live && text.value) {
    const r = await post('/type', text.value).catch(() => ({ ok: false, error: 'geen verbinding' }));
    if (!r.ok) { toast('Typen lukt niet: ' + r.error); return; }
    text.value = ''; $('#clear').hidden = true;
  }
  if (await press(live ? 'enter' : 'ok')) text.blur();
}
tap($('#enter'), search);
$('#typer').addEventListener('submit', (e) => { e.preventDefault(); search(); });
</script>
</body>
</html>
